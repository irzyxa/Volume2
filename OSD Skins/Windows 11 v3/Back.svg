<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="216" height="72" viewBox="0 0 216 72">
<!-- Volume2 draws the background twice: the shadow outside the opaque panel has half the Windows 11 opacity --><style>.shadow{fill:#000000}.border{fill:none;stroke:#000000}@media (prefers-color-scheme: light){.shadow{fill-opacity:0.075}.border{stroke-opacity:0.03}.panel{fill:#F9F9F9}.track{fill:#000000;fill-opacity:0.447}}@media (prefers-color-scheme: dark){.shadow{fill-opacity:0.15}.border{stroke-opacity:0.1}.panel{fill:#2C2C2C}.track{fill:#FFFFFF;fill-opacity:0.545}}</style><defs><filter id="soft" x="-15%" y="-60%" width="130%" height="220%"><feGaussianBlur stdDeviation="7"/></filter></defs><rect class="shadow" x="12" y="16" width="192" height="48" rx="8" filter="url(#soft)"/><g transform="translate(12,12)"><rect class="border" x="-0.5" y="-0.5" width="193" height="49" rx="8.5"/><rect class="panel" width="192" height="48" rx="8"/><rect class="track" x="42" y="22" width="110" height="4" rx="2"/></g>
</svg>
